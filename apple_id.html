<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple ID 共享数据</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
                 Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #eef3fb 0%, #f7f9fc 260px, #f7f9fc 100%);
    color: #1d1d1f;
  }

  /* ===== 顶部工具栏 ===== */
  .app-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 14px 24px; flex-shrink: 0;
    background: rgba(255,255,255,.82);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(0,0,0,.06);
  }
  .app-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 16px; font-weight: 600; letter-spacing: .01em;
  }
  .badge-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #34c759;
    box-shadow: 0 0 0 4px rgba(52,199,89,.18);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 4px rgba(52,199,89,.18); }
    50% { box-shadow: 0 0 0 7px rgba(52,199,89,.08); }
  }
  .app-actions { display: flex; gap: 10px; }
  .btn-pill {
    appearance: none; border: 0; cursor: pointer;
    font-size: 13px; font-weight: 600; font-family: inherit;
    padding: 8px 16px; border-radius: 999px;
    transition: transform .12s ease, background .15s ease, box-shadow .15s ease;
  }
  .btn-pill:active { transform: scale(.96); }
  .btn-ghost { background: rgba(0,0,0,.05); color: #1d1d1f; }
  .btn-ghost:hover { background: rgba(0,0,0,.09); }
  .btn-solid {
    background: #0071e3; color: #fff;
    box-shadow: 0 4px 14px rgba(0,113,227,.28);
  }
  .btn-solid:hover { background: #005bb5; }

  /* ===== 提示卡片 ===== */
  .notice-wrap {
    padding: 14px 24px 12px;   /* 左右 24px，与下方 iframe 对齐 */
    flex-shrink: 0;
  }
  .notice {
    padding: 14px 18px;
    background: #fff;
    border-radius: 16px;
    border: 1px solid rgba(0,0,0,.05);
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -16px rgba(0,0,0,.12);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* 第一行：火箭图标 + 下载提示，作为一个整体 */
  .notice-download {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
    color: #1d1d1f;
    line-height: 1.5;
  }
  .rocket-icon {
    flex-shrink: 0;
    width: 32px; height: 32px;
    border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0071e3 0%, #4aa3ff 100%);
    color: #fff;
    box-shadow: 0 4px 12px -4px rgba(0,113,227,.55);
  }
  .rocket-icon svg { width: 19px; height: 19px; display: block; }
  .notice-download strong { color: #0071e3; font-weight: 600; }

  /* 第二块：红色警告 */
  .notice-warn {
    list-style: none;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(255,59,48,.06);
    border-left: 3px solid #ff3b30;
    color: #d70015;
    font-size: 13px;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .notice-warn li { display: flex; gap: 6px; align-items: flex-start; }
  .notice-warn .ico { flex-shrink: 0; line-height: 1.6; }

  /* ===== iframe 区域：左右内边距与提示卡片一致 ===== */
  .frame-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    padding: 0 24px 24px;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: #fff;
    border-radius: 16px;
    border: 1px solid rgba(0,0,0,.05);
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -16px rgba(0,0,0,.12);
  }

  @media (max-width: 600px) {
    .app-bar { padding: 12px 14px; }
    .app-title { font-size: 14px; }
    .btn-pill { padding: 7px 13px; font-size: 12px; }
    .notice-wrap { padding: 12px 14px 10px; }
    .notice { padding: 12px 14px; border-radius: 14px; gap: 8px; }
    .notice-download { font-size: 13px; gap: 8px; }
    .rocket-icon { width: 28px; height: 28px; border-radius: 8px; }
    .rocket-icon svg { width: 16px; height: 16px; }
    .notice-warn { font-size: 12px; padding: 8px 10px; }
    .frame-wrap { padding: 0 14px 16px; }
    iframe { border-radius: 14px; }
  }
</style>
</head>
<body>
  <header class="app-bar">
    <div class="app-title"><span class="badge-dot"></span>Apple ID 共享数据</div>
    <div class="app-actions">
      <button class="btn-pill btn-ghost" id="openBtn">新窗口打开</button>
      <button class="btn-pill btn-solid" id="refreshBtn">刷新</button>
    </div>
  </header>

  <!-- 提示卡片 -->
  <div class="notice-wrap">
    <div class="notice">
      <!-- 火箭图标 + 下载提示 作为一个整体 -->
      <div class="notice-download">
        <span class="rocket-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
            <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
            <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/>
            <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>
          </svg>
        </span>
        <span>苹果 App Store 搜索 <strong>Shadowrocket</strong> 下载</span>
      </div>

      <!-- 红色警告 -->
      <ul class="notice-warn">
        <li>
          <span class="ico">🔴</span>
          <span>使用免费共享苹果账号必须从 <strong>App Store</strong> 登录，千万不要登录「iCloud」，否则可能导致锁机或者隐私泄漏！</span>
        </li>
        <li>
          <span class="ico">📛</span>
          <span>系统全自动，完全免费，我们没有任何收费解锁服务。收费解锁都是骗子。</span>
        </li>
      </ul>
    </div>
  </div>

  <!-- iframe 内容区 -->
  <div class="frame-wrap">
    <iframe id="contentFrame"
            src="/api/appleid"
            title="Apple ID 数据"
            loading="lazy"></iframe>
  </div>

  <script>
    const DATA_URL = '/api/appleid';
    const frame = document.getElementById('contentFrame');

    document.getElementById('refreshBtn').addEventListener('click', () => {
      frame.src = DATA_URL + '?t=' + Date.now();
    });

    document.getElementById('openBtn').addEventListener('click', () => {
      window.open(DATA_URL, '_blank', 'noopener');
    });
  </script>
</body>
</html>
