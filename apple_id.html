<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple ID 共享数据</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
                 Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #eef3fb 0%, #f7f9fc 260px, #f7f9fc 100%);
    color: #1d1d1f;
  }

  /* ===== 顶部工具栏 ===== */
  .app-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 14px 24px; flex-shrink: 0;
    background: rgba(255,255,255,.82);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(0,0,0,.06);
  }
  .app-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 16px; font-weight: 600; letter-spacing: .01em;
  }
  .badge-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #34c759;
    box-shadow: 0 0 0 4px rgba(52,199,89,.18);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 4px rgba(52,199,89,.18); }
    50% { box-shadow: 0 0 0 7px rgba(52,199,89,.08); }
  }
  .app-actions { display: flex; gap: 10px; }
  .btn-pill {
    appearance: none; border: 0; cursor: pointer;
    font-size: 13px; font-weight: 600; font-family: inherit;
    padding: 8px 16px; border-radius: 999px;
    transition: transform .12s ease, background .15s ease, box-shadow .15s ease;
  }
  .btn-pill:active { transform: scale(.96); }
  .btn-ghost { background: rgba(0,0,0,.05); color: #1d1d1f; }
  .btn-ghost:hover { background: rgba(0,0,0,.09); }
  .btn-solid {
    background: #0071e3; color: #fff;
    box-shadow: 0 4px 14px rgba(0,113,227,.28);
  }
  .btn-solid:hover { background: #005bb5; }

  /* ===== iframe 区域 ===== */
  .frame-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: #fff;
  }

  @media (max-width: 600px) {
    .app-bar { padding: 12px 14px; }
    .app-title { font-size: 14px; }
    .btn-pill { padding: 7px 13px; font-size: 12px; }
  }
</style>
</head>
<body>
  <header class="app-bar">
    <div class="app-title"><span class="badge-dot"></span>Apple ID 共享数据</div>
    <div class="app-actions">
      <button class="btn-pill btn-ghost" id="openBtn">新窗口打开</button>
      <button class="btn-pill btn-solid" id="refreshBtn">刷新</button>
    </div>
  </header>

  <div class="frame-wrap">
    <iframe id="contentFrame"
            src="/api/appleid"
            title="Apple ID 数据"
            loading="lazy"></iframe>
  </div>

  <script>
    const DATA_URL = '/api/appleid';
    const frame = document.getElementById('contentFrame');

    // 刷新：修改 src 并加时间戳，强制重新加载
    document.getElementById('refreshBtn').addEventListener('click', () => {
      frame.src = DATA_URL + '?t=' + Date.now();
    });

    // 新窗口打开
    document.getElementById('openBtn').addEventListener('click', () => {
      window.open(DATA_URL, '_blank', 'noopener');
    });
  </script>
</body>
</html>
