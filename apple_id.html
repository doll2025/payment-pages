<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple ID 共享数据</title>
<!-- 固定版本 Bootstrap，避免原站相对路径 CDN 404 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<style>
  :root {
    --brand: #0071e3;
    --brand-dark: #005bb5;
    --bg-top: #eef3fb;
    --bg-body: #f7f9fc;
    --text: #1d1d1f;
    --text-muted: #6e6e73;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
                 Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-body) 260px, var(--bg-body) 100%);
    color: var(--text);
  }

  /* ===== 顶部工具栏 ===== */
  .app-bar {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 14px 24px;
    background: rgba(255,255,255,.82);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(0,0,0,.06);
  }
  .app-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 16px; font-weight: 600; letter-spacing: .01em;
  }
  .badge-dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: #34c759;
    box-shadow: 0 0 0 4px rgba(52,199,89,.18);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 0 0 4px rgba(52,199,89,.18); }
    50% { box-shadow: 0 0 0 7px rgba(52,199,89,.08); }
  }
  .app-actions { display: flex; gap: 10px; }
  .btn-pill {
    appearance: none; border: 0; cursor: pointer;
    font-size: 13px; font-weight: 600; font-family: inherit;
    padding: 8px 16px; border-radius: 999px;
    transition: transform .12s ease, background .15s ease, box-shadow .15s ease;
  }
  .btn-pill:active { transform: scale(.96); }
  .btn-ghost { background: rgba(0,0,0,.05); color: var(--text); }
  .btn-ghost:hover { background: rgba(0,0,0,.09); }
  .btn-solid {
    background: var(--brand); color: #fff;
    box-shadow: 0 4px 14px rgba(0,113,227,.28);
  }
  .btn-solid:hover { background: var(--brand-dark); }

  /* ===== 内容区 ===== */
  .content-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  #content { animation: fadeUp .45s ease both; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 卡片网格：针对注入后的 .col-lg-3 等栅格列 */
  #content .row { margin-left: -10px; margin-right: -10px; }
  #content .row > [class*="col-"] {
    padding-left: 10px; padding-right: 10px;
    margin-bottom: 20px;
  }
  #content .row > [class*="col-"] > * {
    background: #fff;
    border-radius: 16px;
    padding: 18px;
    border: 1px solid rgba(0,0,0,.04);
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.12);
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  #content .row > [class*="col-"] > *:hover {
    transform: translateY(-3px);
    border-color: rgba(0,113,227,.18);
    box-shadow: 0 4px 10px rgba(0,0,0,.06), 0 18px 40px -16px rgba(0,0,0,.18);
  }

  /* 卡片内按钮圆润化 */
  #content .btn {
    border-radius: 999px;
    font-size: 13px;
    padding: 6px 14px;
    transition: transform .12s ease;
  }
  #content .btn:active { transform: scale(.96); }
  #content .btn-outline-secondary {
    border-color: rgba(0,0,0,.14);
    color: var(--text);
  }
  #content .btn-outline-secondary:hover {
    background: var(--brand);
    border-color: var(--brand);
    color: #fff;
  }

  /* #idBox 说明区 */
  #content #idBox {
    background: #fff;
    border-radius: 16px;
    padding: 20px 22px;
    margin-top: 8px;
    border: 1px solid rgba(0,0,0,.04);
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px -12px rgba(0,0,0,.12);
  }
  #content #idBox hr {
    border: 0; border-top: 1px solid rgba(0,0,0,.06); margin: 14px 0;
  }
  #content #idBox p {
    margin: 0; color: var(--text-muted); font-size: 14px; line-height: 1.7;
  }

  /* ===== 状态 ===== */
  .state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px;
    padding: 90px 20px; color: #86868b; font-size: 14px;
  }
  .state.hidden { display: none; }
  .spinner {
    width: 30px; height: 30px;
    border: 3px solid rgba(0,0,0,.08);
    border-top-color: var(--brand);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .app-bar { padding: 12px 14px; }
    .app-title { font-size: 14px; }
    .btn-pill { padding: 7px 13px; font-size: 12px; }
    .content-wrap { padding: 18px 12px 40px; }
  }
</style>
</head>
<body>
  <header class="app-bar">
    <div class="app-title"><span class="badge-dot"></span>Apple ID 共享数据</div>
    <div class="app-actions">
      <button class="btn-pill btn-ghost" id="openBtn">新窗口打开</button>
      <button class="btn-pill btn-solid" id="refreshBtn">刷新</button>
    </div>
  </header>

  <main class="content-wrap">
    <div id="content"></div>
    <div class="state" id="loadingState">
      <div class="spinner"></div>
      <p>正在加载数据…</p>
    </div>
    <div class="state hidden" id="errorState">
      <p>加载失败，请稍后重试。</p>
      <button class="btn-pill btn-solid" id="retryBtn">重试</button>
    </div>
  </main>

  <script>
    // ==================== 内容加载 ====================
    const PROXY_URL = '/appleid';
    const content = document.getElementById('content');
    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');

    async function loadContent(forceReload = false) {
      loadingState.classList.remove('hidden');
      errorState.classList.add('hidden');
      content.innerHTML = '';

      try {
        const url = forceReload ? PROXY_URL + '?t=' + Date.now() : PROXY_URL;
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');

        // 移除脚本与原有样式，避免与当前页面冲突
        doc.querySelectorAll('script').forEach(s => s.remove());
        doc.querySelectorAll('head style, head link[rel="stylesheet"]').forEach(s => s.remove());

        content.innerHTML = doc.body.innerHTML;
      } catch (e) {
        console.error(e);
        errorState.classList.remove('hidden');
      } finally {
        loadingState.classList.add('hidden');
      }
    }

    // ==================== 复制功能修复 ====================
    // 原页面脚本已被移除，onclick 引用的函数不存在；这里重新提供

    async function __copy(text) {
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
      } catch (e) {
        // 降级方案：兼容非 HTTPS 或旧浏览器
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.cssText = 'position:fixed;top:-9999px;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (_) {}
        ta.remove();
      }
      __toast('已复制：' + text);
    }

    // 覆盖常见的全局函数名，兼容 onclick="copyText('...')" / copyText(this, '...')
    ['copyText', 'copy', 'copyToClipboard', 'copyContent', 'copyAccount', 'copyPassword']
      .forEach(name => {
        window[name] = function (a, b) {
          const text = typeof a === 'string' ? a : (typeof b === 'string' ? b : null);
          if (text) __copy(text);
        };
      });

    // 事件委托：处理 data-clipboard-text 和无 onclick 的复制按钮
    document.addEventListener('click', function (e) {
      const btn = e.target.closest('button, a.btn, .btn');
      if (!btn) return;

      // 1) data 属性直接给文本
      const dataText = btn.getAttribute('data-clipboard-text')
                    || btn.getAttribute('data-copy-text');
      if (dataText) {
        e.preventDefault();
        __copy(dataText);
        return;
      }

      // 2) 没有 onclick，但按钮文字包含"复制"：从卡片内提取账号/密码
      const label = (btn.textContent || '').trim();
      if (!btn.hasAttribute('onclick') && /复制/.test(label)) {
        const text = __extractFromCard(btn, label);
        if (text) {
          e.preventDefault();
          __copy(text);
        }
      }
    });

    // 从按钮所在卡片里提取"账号：xxx" / "密码：xxx" 后面的内容
    function __extractFromCard(btn, label) {
      const card = btn.closest('[class*="col-"]') || btn.parentElement;
      if (!card) return null;
      const kw = /账号/.test(label) ? '账号' : (/密码/.test(label) ? '密码' : null);
      if (!kw) return null;

      const walker = document.createTreeWalker(card, NodeFilter.SHOW_TEXT);
      let n;
      while ((n = walker.nextNode())) {
        const t = n.textContent.trim();
        const i = t.indexOf(kw);
        if (i !== -1) {
          const rest = t.slice(i + kw.length).replace(/^[：:\s]+/, '').trim();
          if (rest) return rest;
        }
      }
      return null;
    }

    function __toast(msg) {
      let el = document.getElementById('__copyToast');
      if (!el) {
        el = document.createElement('div');
        el.id = '__copyToast';
        el.style.cssText = 'position:fixed;left:50%;bottom:40px;transform:translateX(-50%);' +
          'background:rgba(0,0,0,.85);color:#fff;padding:10px 20px;border-radius:999px;' +
          'font-size:14px;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;' +
          'max-width:80vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
        document.body.appendChild(el);
      }
      el.textContent = msg;
      el.style.opacity = '1';
      clearTimeout(el.__t);
      el.__t = setTimeout(() => { el.style.opacity = '0'; }, 1600);
    }

    // ==================== 事件绑定与初始化 ====================
    document.getElementById('refreshBtn').addEventListener('click', () => loadContent(true));
    document.getElementById('retryBtn').addEventListener('click', () => loadContent(true));
    document.getElementById('openBtn').addEventListener('click', () => {
      window.open(PROXY_URL, '_blank', 'noopener');
    });

    loadContent();
  </script>
</body>
</html>
