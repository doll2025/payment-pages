<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apple ID 共享数据</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f7;
    min-height: 100vh;
  }
  .toolbar {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px; background: #fff;
    border-bottom: 1px solid #e5e5e7;
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }
  .toolbar h1 {
    font-size: 16px; font-weight: 600; color: #1d1d1f;
    display: flex; align-items: center; gap: 8px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #34c759; box-shadow: 0 0 0 3px rgba(52,199,89,.2);
  }
  .actions { display: flex; gap: 8px; }
  button {
    font-size: 13px; padding: 7px 14px; border: none; border-radius: 8px;
    cursor: pointer; font-family: inherit; transition: all .15s ease;
  }
  .btn-primary { background: #0071e3; color: #fff; }
  .btn-primary:hover { background: #0077ed; }
  .btn-secondary { background: #e8e8ed; color: #1d1d1f; }
  .btn-secondary:hover { background: #dddde2; }
  button:active { transform: scale(.97); }
  #content { padding: 16px; max-width: 1200px; margin: 0 auto; }
  .state {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 80px 20px;
    color: #86868b; font-size: 14px;
  }
  .state.hidden { display: none; }
  .spinner {
    width: 28px; height: 28px; border: 3px solid #e5e5e7;
    border-top-color: #0071e3; border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 600px) {
    .toolbar { padding: 10px 14px; }
    .toolbar h1 { font-size: 14px; }
    button { padding: 6px 12px; font-size: 12px; }
    #content { padding: 10px; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <h1><span class="dot"></span>Apple ID 共享数据</h1>
    <div class="actions">
      <button class="btn-secondary" id="openBtn">新窗口打开</button>
      <button class="btn-primary" id="refreshBtn">刷新</button>
    </div>
  </div>

  <div id="content"></div>

  <div class="state" id="loadingState">
    <div class="spinner"></div><p>正在加载数据…</p>
  </div>
  <div class="state hidden" id="errorState">
    <p>加载失败，请稍后重试。</p>
    <button class="btn-primary" id="retryBtn">重试</button>
  </div>

  <script>
    const PROXY_URL = '/appleid';
    const content = document.getElementById('content');
    const loadingState = document.getElementById('loadingState');
    const errorState = document.getElementById('errorState');

    // 移除上一次注入的样式，避免刷新时重复堆积
    function clearInjectedStyles() {
      document.querySelectorAll('[data-injected-style]').forEach(el => el.remove());
    }

    async function loadContent(forceReload = false) {
      loadingState.classList.remove('hidden');
      errorState.classList.add('hidden');
      content.innerHTML = '';

      try {
        const url = forceReload ? PROXY_URL + '?t=' + Date.now() : PROXY_URL;
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);

        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');

        // 1. 注入样式（去重）
        clearInjectedStyles();
        doc.querySelectorAll('head style, head link[rel="stylesheet"]')
          .forEach(node => {
            const clone = node.cloneNode(true);
            clone.setAttribute('data-injected-style', '1');
            document.head.appendChild(clone);
          });

        // 2. 移除 body 里的 script（innerHTML 注入本来也不会执行，清掉更干净）
        doc.querySelectorAll('body script').forEach(s => s.remove());

        // 3. 注入 body 内容
        content.innerHTML = doc.body.innerHTML;
      } catch (e) {
        console.error(e);
        errorState.classList.remove('hidden');
      } finally {
        loadingState.classList.add('hidden');
      }
    }

    document.getElementById('refreshBtn').addEventListener('click', () => loadContent(true));
    document.getElementById('retryBtn').addEventListener('click', () => loadContent(true));
    document.getElementById('openBtn').addEventListener('click', () => {
      window.open(PROXY_URL, '_blank', 'noopener');
    });

    loadContent();
  </script>
</body>
</html>
